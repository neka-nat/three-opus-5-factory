<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>工場 3D — Factory Reconstruction (three.js)</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eaec;
        --dim: #9aa1a8;
        --panel: rgba(16, 18, 21, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #e0761a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; background: #0b0c0e; }
      body {
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", "Noto Sans JP", sans-serif;
        color: var(--ink);
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* ── loading ───────────────────────────────────────────────────────── */
      #loader {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
        background: #0b0c0e; z-index: 50; transition: opacity .6s ease;
        text-align: center;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
      #loader p { margin: 0; color: var(--dim); font-size: 12px; }
      .bar { width: 240px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 30%; background: var(--accent);
        animation: slide 1.15s cubic-bezier(.45,.05,.55,.95) infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }

      /* ── HUD ───────────────────────────────────────────────────────────── */
      .panel {
        position: fixed; background: var(--panel); backdrop-filter: blur(14px);
        border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
        box-shadow: 0 10px 34px rgba(0,0,0,.45);
        /* Must sit above #matte (5) and #ref (6): on a wide window the
           photo-match letterbox bars fall exactly where the HUD lives, and
           without this they paint straight over it — the controls stay
           clickable but become invisible. */
        z-index: 20;
      }
      #hud { top: 14px; left: 14px; max-width: 300px; }
      #hud h2 { margin: 0 0 2px; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
      #hud .sub { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
      #hud .row { display: flex; gap: 6px; flex-wrap: wrap; }
      button, select {
        font: inherit; font-size: 11.5px; color: var(--ink); background: rgba(255,255,255,.07);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer;
        transition: background .15s, border-color .15s;
      }
      button:hover, select:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.24); }
      button.on { background: var(--accent); border-color: var(--accent); color: #14161a; font-weight: 600; }
      select { cursor: pointer; }
      option { background: #16181b; }

      #stats {
        bottom: 14px; left: 14px; font-variant-numeric: tabular-nums; color: var(--dim);
        font-size: 11px; padding: 8px 11px; line-height: 1.7;
      }
      #stats b { color: var(--ink); font-weight: 600; }

      #help {
        bottom: 14px; right: 14px; color: var(--dim); font-size: 11px;
        padding: 8px 11px; line-height: 1.7; text-align: right;
      }
      kbd {
        display: inline-block; padding: 0 4px; min-width: 16px; text-align: center;
        border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
        background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: 10px;
      }

      /* ── photo-match letterbox + reference overlay ─────────────────────── */
      #matte { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
      #matte.on { display: block; }
      #matte div { position: absolute; background: #0b0c0e; }
      #ref {
        position: fixed; inset: 0; margin: auto; pointer-events: none; z-index: 6;
        object-fit: contain; opacity: 0; transition: opacity .2s; mix-blend-mode: normal;
      }
      #slider {
        position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); z-index: 20;
        display: none; align-items: center; gap: 10px; padding: 8px 14px;
      }
      #slider.on { display: flex; }
      #slider input { width: 220px; accent-color: var(--accent); }
      #mode-note {
        margin-top: 7px; font-size: 10.5px; line-height: 1.45; color: var(--dim);
        border-left: 2px solid var(--accent); padding-left: 7px;
      }
      #mode-note.hidden { display: none; }
      details summary { cursor: pointer; color: var(--dim); font-size: 11px; margin-top: 10px; outline: none; }
      details[open] summary { color: var(--ink); }
      .grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center;
        margin-top: 8px; font-size: 11px; color: var(--dim); }
      .grid input[type=range] { width: 100%; accent-color: var(--accent); }
      @media (max-width: 720px) { #help { display: none; } #hud { max-width: 210px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loader">
      <h1>工場 3D</h1>
      <div class="bar"><i></i></div>
      <p id="loader-msg">building scene…</p>
    </div>

    <div id="hud" class="panel">
      <h2>工場 3D リコンストラクション</h2>
      <div class="sub">img01.jpg · three.js r185</div>
      <div class="row">
        <button id="btn-photo" class="on">📷 Photo match</button>
        <button id="btn-orbit">🔄 Free orbit</button>
      </div>
      <div id="mode-note">写真と同じ固定アングルです · drag anywhere to explore in 3D</div>
      <div class="row" style="margin-top:6px">
        <select id="sel-view">
          <option value="photo">View · 写真アングル</option>
          <option value="aisle">View · 通路</option>
          <option value="cell">View · ロボットセル</option>
          <option value="crane">View · クレーン</option>
          <option value="top">View · 俯瞰</option>
        </select>
      </div>
      <details>
        <summary>Options</summary>
        <div class="row" style="margin-top:8px">
          <button id="btn-ref">Overlay ref</button>
          <button id="btn-ssao" class="on">SSAO</button>
          <button id="btn-bloom" class="on">Bloom</button>
          <button id="btn-shadow" class="on">Shadows</button>
        </div>
        <div class="grid">
          <label for="rng-exposure">Exposure</label>
          <input id="rng-exposure" type="range" min="0.4" max="2.0" step="0.01" value="1.05" />
          <label for="sel-tone">Tone map</label>
          <select id="sel-tone">
            <option value="neutral">Neutral</option>
            <option value="aces">ACES Filmic</option>
            <option value="agx">AgX</option>
            <option value="linear">Linear</option>
          </select>
        </div>
      </details>
    </div>

    <div id="slider" class="panel">
      <span style="color:var(--dim);font-size:11px">写真</span>
      <input id="rng-ref" type="range" min="0" max="1" step="0.01" value="0.5" />
      <span style="color:var(--dim);font-size:11px">3D</span>
    </div>

    <div id="stats" class="panel">
      <div><b id="s-fps">–</b> fps</div>
      <div><b id="s-tri">–</b> triangles · <b id="s-calls">–</b> draw calls</div>
    </div>

    <div id="help" class="panel">
      <div><kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>⇧</kbd>+<kbd>drag</kbd> pan</div>
      <div><kbd>O</kbd> free orbit · <kbd>P</kbd> photo match</div>
      <div><kbd>1</kbd>–<kbd>5</kbd> views · <kbd>R</kbd> overlay · <kbd>H</kbd> hide UI</div>
    </div>

    <div id="matte"><div></div><div></div><div></div><div></div></div>
    <img id="ref" src="/img01.jpg" alt="reference photograph" />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
